name: Build iPhone app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for iPhone
        run: |
          xcodebuild \
            -project LectureRecorder.xcodeproj \
            -scheme LectureRecorder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LectureRecorder.app Payload/
          zip -qr LectureRecorder.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LectureRecorder
          path: LectureRecorder.ipa